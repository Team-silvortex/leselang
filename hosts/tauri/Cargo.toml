[package]
name = "leselang-tauri-host"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "An explicit LeseLang host for registered TypeScript controls in Tauri"

[workspace]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[dependencies]
leselang-vm = { path = "../../crates/leselang-vm" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "=2.10.3", optional = true }

[target.'cfg(target_os = "macos")'.build-dependencies]
tauri-build = { version = "=2.5.6", optional = true }

[profile.lean]
inherits = "dev"
debug = 0
incremental = false

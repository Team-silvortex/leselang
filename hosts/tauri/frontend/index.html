<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LeseLang TypeScript host</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="eyebrow">LeseLang · TypeScript</span>
        <h1>A real web form.</h1>
        <p>Discover the input, change its text, save it, and check the result.</p>
      </header>

      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">Message</h2>
        <label for="message">Text to save</label>
        <textarea id="message" name="message" rows="3" spellcheck="false"></textarea>
        <div class="actions">
          <button id="save" type="button">Save</button>
          <button id="other" class="secondary" type="button">Other control</button>
        </div>
        <p id="status" role="status" aria-live="polite">Connecting to the host…</p>
      </section>

      <section class="card result" aria-labelledby="saved-title">
        <div class="result-heading">
          <h2 id="saved-title">Saved message</h2>
          <span id="save-count" class="count">0 saves</span>
        </div>
        <pre id="saved-value" aria-label="Saved message value"></pre>
        <p class="quiet">Other control clicks: <span id="other-count">0</span></p>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>

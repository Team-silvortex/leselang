[workspace]

[package]
name = "leselang-native-source-consumer"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
autotests = false

[dependencies]
leselang-hir = { path = "../crates/leselang-hir" }
leselang-hir-core = { path = "../crates/leselang-hir-core" }
leselang-runtime-core = { path = "../crates/leselang-runtime-core" }
leselang-syntax = { path = "../crates/leselang-syntax" }
leselang-vm = { path = "../crates/leselang-vm", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[profile.lean]
inherits = "dev"
debug = 0
incremental = false


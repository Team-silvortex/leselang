name: Leselang
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - run: cargo +1.98.0 fetch --locked
      - run: cargo +1.98.0 fetch --manifest-path tools/leselang-dev/Cargo.toml --locked
      - name: Validate development tensor and task selection
        run: sh scripts/check.sh tensor
      - run: cargo +1.98.0 fetch --manifest-path consumer/Cargo.toml --locked
      - run: cargo +1.98.0 fetch --manifest-path hosts/appkit/Cargo.toml --locked
      - run: cargo +1.98.0 fetch --manifest-path hosts/macos-ax/Cargo.toml --locked
      - name: Check language workspace
        run: sh scripts/check.sh language
      - name: Check independent Rust Consumer and catalog agent
        run: sh scripts/check.sh consumer
      - name: Check AppKit host without opening a GUI
        run: sh scripts/check.sh appkit
      - name: Check Accessibility contracts and native boundaries
        run: sh scripts/check.sh macos-ax
      - name: Exercise CLI, embedding and offline host plans
        run: sh scripts/check.sh smoke
  dotnet-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.201'
      - run: rustup toolchain install 1.98.0 --profile minimal
      - run: cargo +1.98.0 fetch --manifest-path hosts/registered/Cargo.toml --locked
      - run: cargo +1.98.0 fetch --manifest-path consumer/Cargo.toml --locked
      - name: Run native worker and independent C# Consumer
        shell: bash
        run: sh scripts/check.sh dotnet-consumer
  typescript-host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.6.0'
      - run: rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
      - run: npm ci --prefix packages/javascript --ignore-scripts
      - run: npm ci --prefix hosts/tauri --ignore-scripts
      - run: npm ci --prefix consumer/javascript --ignore-scripts
      - run: cargo +1.98.0 fetch --manifest-path hosts/tauri/Cargo.toml --locked
      - run: cargo +1.98.0 fetch --manifest-path hosts/registered/Cargo.toml --locked
      - run: cargo +1.98.0 fetch --manifest-path consumer/Cargo.toml --locked
      - name: Check SDK package and Tauri frontend once each
        run: sh scripts/check.sh javascript
      - name: Check portable Tauri host
        run: sh scripts/check.sh tauri-portable
      - name: Check standalone registered host and Rust consumer
        run: sh scripts/check.sh registered
      - name: Check Node carriers, packed real-VM consumer and offline Tauri plan
        run: sh scripts/check.sh node-consumer
      - name: Check real Tauri transport without opening a GUI
        if: runner.os == 'macOS'
        run: sh scripts/check.sh tauri-desktop
